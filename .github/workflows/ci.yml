name: Non-release validation

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: non-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Node ${{ matrix.node }} / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['18.x', '24.x']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          # No cache: the package is zero-dependency and has no lockfile.
          package-manager-cache: false
      - name: Syntax-check sources
        run: |
          set -euo pipefail
          find src -name '*.js' -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done
      - run: npm test
      - run: npm pack --dry-run

  core-windows:
    name: Core / Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # No workspace-local TEMP redirect here: unlike the root CI, engine
      # tests probe git upward from os.tmpdir() and must NOT land inside a
      # repository worktree (sourceIdentity assertions expect commit:null).
      # The 8.3-short-path TEMP on runners has not surfaced as an issue for
      # this suite; revisit only if a Windows run proves otherwise.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Syntax-check sources
        shell: pwsh
        run: |
          Get-ChildItem -Path src -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: npm test
      - run: npm pack --dry-run
